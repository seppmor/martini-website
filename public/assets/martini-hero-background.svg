<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1260" preserveAspectRatio="none">
  <defs>
    <filter id="paper-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="5" seed="32" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0 0 0 0 .62 0 0 0 0 .49 0 0 0 0 .28 0 0 0 .18 0"/>
    </filter>
    <filter id="wash" x="-28%" y="-28%" width="156%" height="156%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .024" numOctaves="4" seed="12" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="38" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="fine-speckle" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" seed="9" result="dust"/>
      <feColorMatrix in="dust" type="matrix" values="0 0 0 0 .72 0 0 0 0 .54 0 0 0 0 .2 0 0 0 .12 0"/>
    </filter>
    <radialGradient id="paper-light" cx="50%" cy="26%" r="64%">
      <stop offset="0" stop-color="#fffdf7" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff8ea" stop-opacity=".28"/>
      <stop offset="1" stop-color="#eadfca" stop-opacity=".22"/>
    </radialGradient>
    <linearGradient id="edge-shade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b79a6a" stop-opacity=".2"/>
      <stop offset=".14" stop-color="#f7eddd" stop-opacity="0"/>
      <stop offset=".86" stop-color="#f7eddd" stop-opacity="0"/>
      <stop offset="1" stop-color="#b79a6a" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c09631" stop-opacity=".06"/>
      <stop offset=".22" stop-color="#c09631" stop-opacity=".78"/>
      <stop offset=".68" stop-color="#c09631" stop-opacity=".52"/>
      <stop offset="1" stop-color="#c09631" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="gold-line-soft" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c09631" stop-opacity="0"/>
      <stop offset=".42" stop-color="#c09631" stop-opacity=".32"/>
      <stop offset="1" stop-color="#c09631" stop-opacity=".02"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1260" fill="#f3e8d6"/>
  <rect width="1440" height="1260" fill="#fff8ec" opacity=".64"/>
  <rect width="1440" height="1260" fill="url(#paper-light)"/>
  <rect width="1440" height="1260" fill="#9d7d42" opacity=".9" filter="url(#paper-grain)"/>
  <rect width="1440" height="1260" fill="url(#edge-shade)"/>

