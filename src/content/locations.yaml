main:
  kicker: 01 / Wann und Wo?
  title: Trauung in Mettmann, Feier im Wasserschloss.
  intro: >-
    Der Tag startet am Samstag, den 17. Juli 2027, mit der Ankunft zur Trauung
    um ca. 13:30 Uhr in Mettmann. Ab ca. 16:30 Uhr geht es im Wasserschloss
    Hackhausen in Solingen weiter.
  noteLabel: "Bitte beachten:"
  note: >-
    Alle Uhrzeiten sind ungefähre Angaben und noch nicht final. Schaut bitte
    etwa vier Wochen vor der Hochzeit noch einmal auf dieser Webseite vorbei;
    hier findet Ihr dann die finalen Zeiten.
  ceremonyLabel: Trauung
  celebrationLabel: Feier
  orientationText: >-
    Für die Orientierung könnt Ihr beide Orte direkt in Google Maps öffnen.
    Hinweise zu Parken, ÖPNV und Übernachtung ergänzen wir noch.
